apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ticket-triage-model
  namespace: model-serving
spec:
  predictor:
    containers:
    - name: kserve-container
      image: ghcr.io/sraviauniverse/ticket-triage-api:0a12d857
      ports:
      - containerPort: 8000
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: '1'
          memory: 1Gi
    minReplicas: 1
    maxReplicas: 3
